name: Build and Upload nightly game builds

on:
  workflow_dispatch:
    inputs:
      build-defines:
        type: string
        description: Build defines to use
        default: '-DGITHUB_BUILD'
      save-artifact:
        type: boolean
        description: Save the build artifact to Github Actions (sends to itch otherwise)
        default: true
  push:

jobs:

  build-game-in-container:
    runs-on: ubuntu-latest
    # 🌟 FNF公式が提供している、完璧に設定済みのビルド環境（コンテナ）を直接使います！
    container: ghcr.io/funkincrew/build-dependencies:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: html5
    defaults:
      run:
        shell: bash
    env:
      BUILD_DEFINES: ${{ github.event.inputs.build-defines || '-DGITHUB_BUILD' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Config haxelib
        run: |
          haxelib --never newrepo
          echo "HAXEPATH=$(haxelib config)" >> "$GITHUB_ENV"

      - name: Setup Haxe Environment
        run: |
          haxelib run hmm setup || true
          haxelib run hmm install || true

      - name: Build game (HTML5)
        run: |
          haxelib run lime build html5 -v -release $BUILD_DEFINES
        timeout-minutes: 60

      - name: Save build artifact to Github Actions
        uses: actions/upload-artifact@v4
        with:
          name: build-html5
          path: export/release/html5/bin/
