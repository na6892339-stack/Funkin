# Builds the game for HTML5 to ensure it compiles for web port.
name: Build and Upload nightly game builds

on:
  workflow_dispatch:
    inputs:
      build-defines:
        type: string
        description: Build defines to use
        default: '-DGITHUB_BUILD'
      save-artifact:
        type: boolean
        description: Save the build artifact to Github Actions (sends to itch otherwise)
        default: true
  push:

jobs:

  gather-changes:
    runs-on: ubuntu-latest
    outputs:
      trigger-build: 'true'
    steps:
      - name: Skip check and always trigger
        run: echo "Triggering build for Web Port"

  gather-tags:
    runs-on: ubuntu-latest
    outputs:
      primary: 'latest'
      list: 'latest'
    steps:
      - name: Skip tag gathering
        run: echo "Using latest tags"

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Skip docker image creation
        run: echo "Using standard environment"

  build-game-on-host:
    runs-on: ubuntu-latest
    steps:
      - name: Skip Desktop Builds
        run: echo "Skipping desktop builds to optimize for Web port!"

  build-game-in-container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: html5
    defaults:
      run:
        shell: bash
    env:
      BUILD_DEFINES: ${{ github.event.inputs.build-defines || '-DGITHUB_BUILD' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      
      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install Haxe Libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install hxp
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib run lime setup
          haxelib run hmm setup || true
          haxelib run hmm install || true

      - name: Build game (HTML5)
        run: |
          haxelib run lime build html5 -v -release $BUILD_DEFINES
        timeout-minutes: 60

      - name: Save build artifact to Github Actions
        uses: actions/upload-artifact@v4
        with:
          name: build-html5
          path: export/release/html5/bin/
